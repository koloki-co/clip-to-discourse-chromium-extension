<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip to Discourse</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <!-- Header + navigation to settings -->
      <header class="header">
        <div class="brand">
          <img class="brand-mark" src="../assets/images/clip-to-discourse-logo.svg" alt="Clip to Discourse logo" />
          <div class="brand-copy">
            <h1>Clip to Discourse</h1>
          </div>
        </div>
        <a class="settings-link" href="../options/options.html" target="_blank" rel="noreferrer">Settings</a>
      </header>

      <section id="connection-required" class="connection-required hidden" aria-labelledby="connection-required-title">
        <span class="connection-required-kicker">Setup required</span>
        <h2 id="connection-required-title">Connect a Discourse account to start clipping</h2>
        <p>Authorize your account with User API, or enter an administrator-provided API key.</p>
        <a class="connect-button" href="../options/options.html" target="_blank">Open connection settings</a>
      </section>

      <!-- Selection indicator -->
      <div id="selection-indicator" class="selection-indicator hidden" role="status">
        <span class="selection-icon">📝</span>
        <span id="selection-info" class="selection-info"></span>
      </div>

      <form id="clip-form" class="hidden">
        <!-- Profile selection -->
        <section class="section">
          <h2>Profile</h2>
          <label class="field">
            <select id="profileSelect" name="profileSelect" aria-label="Profile"></select>
          </label>
        </section>
        <!-- Clip style choices -->
        <section class="section">
          <h2>Clip Style</h2>
          <label class="radio">
            <input type="radio" name="clipStyle" value="title_url" checked />
            Title + URL
          </label>
          <label class="radio">
            <input type="radio" name="clipStyle" value="excerpt" />
            Title + URL + excerpt
          </label>
          <label class="radio">
            <input type="radio" name="clipStyle" value="full_text" />
            Full page text
          </label>
          <label class="radio">
            <input type="radio" name="clipStyle" value="text_selection" />
            Text selection
          </label>
        </section>

        <!-- Destination selection with conditional fields -->
        <section class="section">
          <h2>Destination</h2>
          <label class="radio">
            <input type="radio" name="destination" value="new_topic" checked />
            Create new topic
          </label>
          <label class="radio">
            <input type="radio" name="destination" value="append_topic" />
            Append to existing topic
          </label>

          <div id="category-field" class="field">
            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId">
              <option value="">Select a category</option>
            </select>
            <span id="category-status" class="field-status" role="status"></span>
          </div>
          <div id="topic-field" class="field hidden">
            <label for="topicId">Topic ID</label>
            <input id="topicId" name="topicId" type="number" min="1" placeholder="e.g. 345" />
          </div>
        </section>

        <button class="primary" type="submit">Clip</button>
        <p id="status" class="status" role="status"></p>
      </form>

      <footer class="meta-footer" aria-label="Extension info">
        <span>Clip To Discourse &copy; Koloki Ltd. v<span id="popupExtensionVersion">-</span></span>
        <span class="meta-links">
          <a
            href="https://chromewebstore.google.com/detail/clip-to-discourse/copdhiejkkdblhdcdjapcoalldkondhi"
            target="_blank"
            rel="noreferrer"
            title="Chrome Web Store"
            >CWS</a
          >
          <span aria-hidden="true"> | </span>
          <a
            href="https://github.com/koloki-co/clip-to-discourse-chromium-extension"
            target="_blank"
            rel="noreferrer"
            >GitHub</a
          >
        </span>
      </footer>
    </main>

    <script type="module" src="popup.bundle.js"></script>
  </body>
</html>
