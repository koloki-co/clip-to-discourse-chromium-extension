name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0). Must match manifest.json version."
        required: true
        type: string
      publish_target:
        description: "Publish target"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - trusted

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag format
        run: |
          tag="${{ inputs.release_tag }}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must be in the form vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag matches manifest version
        run: |
          tag="${{ inputs.release_tag }}"
          manifest_version=$(node -p "require('./manifest.json').version")
          expected_tag="v${manifest_version}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Tag $tag does not match manifest version $manifest_version"
            exit 1
          fi
          echo "Tag $tag matches manifest version $manifest_version"
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run version:check
      - run: npm run package
      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: >
          npx -y chrome-webstore-upload-cli@2.2.2
          upload
          --source clip-to-discourse-extension.zip
          --extension-id "$EXTENSION_ID"
          --client-id "$CLIENT_ID"
          --client-secret "$CLIENT_SECRET"
          --refresh-token "$REFRESH_TOKEN"
          --auto-publish
          ${{ inputs.publish_target == 'trusted' && '--trusted-testers' || '' }}
